  </defs>
  <rect width="1200" height="900" fill="url(#background)"/>
  <circle cx="860" cy="220" r="430" fill="url(#glow)"/>
  <path d="M-80 760C180 470 430 450 720 610s390 90 560-80v370H-80Z" fill="#160f35" fill-opacity=".76"/>
