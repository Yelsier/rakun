<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Aurora gradients</title>
  <desc id="description">Layered orange, violet and blue gradients.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201247"/>
      <stop offset="0.52" stop-color="#6c2bd9"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe0a8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ff8b66" stop-opacity="0"/>
