  <title id="title">Ember landscape</title>
  <desc id="description">Warm red hills beneath a glowing amber sky.</desc>
  <defs>
    <linearGradient id="ember-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d102f"/>
      <stop offset=".55" stop-color="#b83252"/>
      <stop offset="1" stop-color="#ffb45e"/>
